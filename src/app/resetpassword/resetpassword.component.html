<div class="auth-page">
  <aside class="auth-brand-panel">
    <div class="auth-brand-content">
      <img
        class="auth-logo"
        src="assets/Notago_logo.png"
        alt="NotaGo logo"
      />

      <div class="auth-brand-copy">
        <h1>{{ brandTitle }}</h1>
        <p>{{ brandDescription }}</p>
      </div>

      <div class="auth-trust-list">
        <div class="auth-trust-item" *ngFor="let item of trustItems">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </div>
      </div>

      <img
        class="auth-preview"
        [src]="dashboardPreviewPath"
        alt=""
      />
    </div>
  </aside>

  <main class="auth-content-panel">
    <div class="auth-content-inner">
      <button
        type="button"
        class="auth-back"
        (click)="goLandingPage()"
      >
        <mat-icon>chevron_left</mat-icon>
        <span>Back</span>
      </button>

      <section class="auth-state">
        <h2>Set a new password</h2>
        <p class="auth-state-subtitle">
          Create a secure password for your Notago account.
        </p>

        <form
          class="auth-form reset-password-form"
          [formGroup]="resetformgroup"
          (keydown)="keyDownFunction($event)"
        >
          <div class="auth-field-group">
            <label class="auth-field-label" for="reset-password">New Password</label>
            <mat-form-field appearance="outline" class="auth-field">
              <input
                id="reset-password"
                matInput
                placeholder="New password"
                [type]="hidePassword ? 'password' : 'text'"
                formControlName="password"
                (input)="clearError()"
              />
              <button
                mat-icon-button
                matSuffix
                type="button"
                (click)="hidePassword = !hidePassword"
                [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
                [attr.aria-pressed]="!hidePassword"
              >
                <mat-icon>{{ hidePassword ? "visibility_off" : "visibility" }}</mat-icon>
              </button>
            </mat-form-field>

            <div
              class="auth-strength"
              [ngClass]="'auth-strength--' + strengthScore"
            >
              <div class="auth-strength__bars">
                <span
                  class="auth-strength__bar"
                  *ngFor="let i of strengthSegments"
                  [class.auth-strength__bar--on]="i < strengthScore"
                ></span>
              </div>
              <span class="auth-strength__label">{{ strengthLabel }}</span>
            </div>

            <p class="auth-field-hint">Use 8+ characters with a number and a symbol.</p>
          </div>

          <div class="auth-field-group">
            <label class="auth-field-label" for="reset-confirm-password">Confirm password</label>
            <mat-form-field appearance="outline" class="auth-field">
              <input
                id="reset-confirm-password"
                matInput
                placeholder="Re-enter your password"
                [type]="hideConfirmPassword ? 'password' : 'text'"
                formControlName="repassword"
                (input)="clearError()"
              />
              <button
                mat-icon-button
                matSuffix
                type="button"
                (click)="hideConfirmPassword = !hideConfirmPassword"
                [attr.aria-label]="hideConfirmPassword ? 'Show password' : 'Hide password'"
                [attr.aria-pressed]="!hideConfirmPassword"
              >
                <mat-icon>{{ hideConfirmPassword ? "visibility_off" : "visibility" }}</mat-icon>
              </button>
            </mat-form-field>
          </div>

          <div class="auth-error" *ngIf="errorflag" (click)="clearError()">
            {{ errormessage }}
          </div>

          <button
            type="button"
            mat-button
            class="auth-primary-button"
            (click)="submit()"
          >
            Set new password
          </button>

          <p class="auth-switch-copy">
            Remember Password?
            <button type="button" (click)="goLandingPage()">Log in</button>
          </p>
        </form>
      </section>
    </div>
  </main>
</div>
