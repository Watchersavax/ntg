<div class="mt-4">
    <span class="header-cls mt-2">
    <div class="d-flex justify-content-center mb-2 text-dark">
        <h3 *ngIf="!editFlag">Add New Session</h3>
        <h3 *ngIf="editFlag">Edit New Session</h3>
    </div>
        <button (click)="close()">
          <mat-icon>close</mat-icon>
        </button>
      </span>
</div>
<div class="container-local" style="padding: 1rem 9rem 2rem 4rem;">
    <div class="d-flex justify-content-center" *ngIf="errorFlag">
        <p class="text-danger">*Please fill required fields</p>
    </div>
    <form>
        <div class="form-group">
            <label for="selectTitle">Title</label>
            <input type='text' [(ngModel)]="title" class="form-control" id="title" [ngModelOptions]="{standalone: true}">
        </div>
        <div class="form-group">
            <label for="link">Link</label>
            <input type='text' [(ngModel)]="link" class="form-control" id="link" [ngModelOptions]="{standalone: true}">
        </div>
    </form>
    <div class="sub-container">
        <div>
            <button *ngIf="!editFlag" class="btn" mat-button mat-raised-button (click)="createSession()" style="color: #FFFFFF;">
                Create Session
            </button>

            <button *ngIf="editFlag" class="btn" mat-button mat-raised-button (click)="editSession()" style="color: #FFFFFF;">
                Edit Session
            </button>
        </div>
    </div>
</div>
