<div class="tablewrapper">
  <div class="tablelabel">
    <span style="margin-bottom: 12px;" *ngIf="!showSession">
      <input  id="searchUser" style="border: 0px;border-bottom: 2px solid #545859;outline: none;font-size: medium;width: 18vw;"
              [(ngModel)]="keyword" (ngModelChange)="keywordUpdate.next($event)" placeholder="Search Registrar">
      <mat-icon style="color: #545859;">search</mat-icon>
    </span>
    <span style="
        padding: 0px;
        margin-bottom: 12px;
        font-weight: 500;
        font-size: medium;
      " *ngIf="!showSession">Registrars</span>
    <span style="
        padding: 0px;
        margin-bottom: 12px;
        font-weight: 500;
        font-size: medium;
      " *ngIf="showSession">Sessions</span>
    <div class="button-contain">
      <button class="optional" [class.stoke-button] = "showSession" matTooltip="Set Sessions" mat-button (click)="loadSession()">
        Sessions
      </button>
      <button class="optional" [class.stoke-button] = "!showSession" matTooltip="Add new Registrars" mat-button (click)="createNewUser()">
        New Registrars
      </button>
    </div>
    <div class="button-icon-contain">
      <button class="optional1" [class.stoke-button] = "showSession" matTooltip="Set Sessions" mat-button (click)="loadSession()">
        <mat-icon>schedule</mat-icon>
      </button>
      <button class="optional1" [class.stoke-button] = "!showSession" matTooltip="Add New Registrars" mat-button (click)="createNewUser()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>

  <div class="table-wrapper-cls" *ngIf="!showSession">
    <!-- (matSortChange)="sortData($event)" -->
    
    <div class="table-header-cls" matSort (matSortChange)="sortData($event)" style="border: 1px solid black">
      <div class="table-header-cell-cls" mat-sort-header="firstName" style="border-right: 1px solid #00000038">
        Name
      </div>

      <div class="table-header-cell-cls" mat-sort-header="userName" style="border-right: 1px solid #00000038">
        User Name
      </div>

      <div class="table-header-cell-cls" mat-sort-header="email" style="border-right: 1px solid #00000038">
        Email
      </div>

      <div class="table-header-cell-cls no-sort-header" style="border-right: 1px solid #00000038">
        Session
      </div>

      <div class="table-header-cell-cls no-sort-header" style="flex: 1; border-right: 1px solid #00000038">
        Status
      </div>

      <div class="table-header-cell-cls no-sort-header" style="flex: 1">
        Actions
      </div>
    </div>

    <div class="table-body-cls" infinite-scroll [infiniteScrollDistance]="scrollDistance"
      [infiniteScrollUpDistance]="scrollUpDistance" [infiniteScrollThrottle]="throttle" (scrolled)="nextPage()"
      [infiniteScrollDisabled]="infinitescrolldisable" [scrollWindow]="false">
      <mat-card *ngFor="let user of sortedData; let i = index" class="mat-card-list-cls">
        <div class="table-row-cell-cls">
          <p>{{ user.firstName }}&nbsp;{{ user.lastName }}</p>
        </div>

        <div class="table-row-cell-cls">
          <p>{{ user.userName }}</p>
        </div>

        <div class="table-row-cell-cls">
          <p>{{ user.email }}</p>
        </div>

        <div class="table-row-cell-cls">
          <p>{{ user.sessionName }}</p>
        </div>

        <div class="table-row-cell-cls" style="flex: 1">
          <mat-slide-toggle [checked]="user.active" (change)="onSlide(user)"></mat-slide-toggle>
          </div>

        <div class="table-row-cell-cls" style="padding-left: 0px; margin-left: 0px; flex: 1">
          <div class="action-groups">
            <p (click)="OnTemplateClick(user)" matTooltip="View Affidavits" style="cursor: pointer; margin-right: 5px">
              <mat-icon style="color: blue; margin-top: 5px">open_in_new</mat-icon>
            </p>

            <button matTooltip="Edit User Details" mat-raised-button style="margin: 5px" (click)="editUser(user)">
              <mat-icon style="color: var(--custombtnColor); font-size: 16px">edit</mat-icon>
            </button>
            <button matTooltip="Delete User Details" mat-raised-button style="margin: 5px" (click)="deleteUser(user)">
              <mat-icon style="color: red; font-size: 16px">delete</mat-icon>
            </button>
          </div>
        </div>
      </mat-card>
    </div>
  </div>
  <div class="table-wrapper-cls" *ngIf="showSession">
    <div class="table-header-cls" matSort (matSortChange)="sortData($event)" style="border: 1px solid black">
      <div class="table-header-cell-cls" mat-sort-header="firstName" style="border-right: 1px solid #00000038">
        Title
      </div>

      <div class="table-header-cell-cls" mat-sort-header="userName" style="border-right: 1px solid #00000038">
        Link
      </div>

      <div class="table-header-cell-cls no-sort-header" style="flex: 1; border-right: 1px solid #00000038">
        Status
      </div>

      <div class="table-header-cell-cls no-sort-header" style="flex: 1">
        Actions
      </div>
    </div>

    <div class="table-body-cls" infinite-scroll [infiniteScrollDistance]="scrollDistance"
      [infiniteScrollUpDistance]="scrollUpDistance" [infiniteScrollThrottle]="throttle" (scrolled)="nextPage()"
      [infiniteScrollDisabled]="infinitescrolldisable" [scrollWindow]="false">
      <mat-card *ngFor="let session of sessions; let i = index" class="mat-card-list-cls">

        <div class="table-row-cell-cls">
          <p>{{ session.sessionName }}</p>
        </div>

        <div class="table-row-cell-cls">
          <p>{{ session.sessionUrl }}</p>
        </div>

        <div class="table-row-cell-cls" style="flex: 1">
          <mat-slide-toggle [checked]="session.isActive" (change)="changeSessionStatus(session)"></mat-slide-toggle>
        </div>

        <div class="table-row-cell-cls" style="padding-left: 0px; margin-left: 0px; flex: 1">
          <div class="action-groups">
            <button matTooltip="Edit Session Details" mat-raised-button style="margin: 5px" (click)="editSession(session)">
              <mat-icon style="color: var(--custombtnColor); font-size: 16px">edit</mat-icon>
            </button>
            <button matTooltip="Delete Session Details" mat-raised-button style="margin: 5px"
              (click)="deleteSession(session)">
              <mat-icon style="color: red; font-size: 16px">delete</mat-icon>
            </button>
          </div>
        </div>
      </mat-card>
      <div class="d-flex justify-content-center mt-4">
        <div>
          <button style="width: 10vw;
          background-color: var(--custombgColor);
          margin-bottom: 16px;
          color: white;" class="optional" matTooltip="Add new Registrars" mat-raised-button
            (click)="openSesionDialog()">
            Add New Session
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
