<div class="pagwrapper-cls">
    <div class="datatable-cls">
        <div class="datatable-sidenav-cls">
            <h2>Template List</h2>
        </div>
        <p style="color:red">{{error}}</p>
        <div class="datatable-body-cls">
            <mat-tree #tree [dataSource]="dataSource" [treeControl]="treeControl">
                <!-- This is the tree node template for leaf nodes -->
                
                <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
                    <!-- use a disabled button to provide padding for tree leaf -->
                    
                    <button mat-icon-button enabled (click)="onSubmit(node.name)"><mat-icon style="color:var(--custombgColor)">open_in_new</mat-icon></button>
                    <p style="color:var(--custombgColor)">{{node.name}}</p>
                </mat-tree-node>
                <!-- This is the tree node template for expandable nodes -->
                
                <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding>
                    <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'toggle ' + node.name" (click)="onclick(node,false)">
                        <mat-icon class="mat-icon-rtl-mirror">
                            {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                        </mat-icon>
                    </button>
                    <p style="color:var(--customgrey);    font-size: larger;
                    font-weight: 500;">{{node.name}}</p>
                </mat-tree-node>
            </mat-tree>
        </div>
    </div>
</div>
