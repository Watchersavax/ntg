<div class="documentlisting-cls">
    <div class="searchbox-cls">
        <div class="searchrow-cls">
            <span class="searchbox-wrapper-cls">
                <mat-icon style="color: #545859;">search</mat-icon>
                <input id="searchUserAffidavit"
                    [(ngModel)]="searchKeyword" (ngModelChange)="search()" placeholder="Search by name..." />
            </span>

            <div class="paginator-cls">
                <app-paginator [page]="pageParam.page" [hasPrev]="!prevflag" [hasNext]="!nextflag"
                    [message]="dataMessage" (prevClick)="previousPage()" (nextClick)="nextPage()"></app-paginator>
            </div>
        </div>

        <div class="filteroptions">
            <button (click)="onStatusChange('Pending')" style="cursor: pointer"
                [className]="(activeStatusTab['finalStatus'] == 'Pending') ? 'active-filter-class' : 'inactive-filter-cls'">Draft</button>
            <button (click)="onStatusChange('Paid')" style="cursor: pointer"
                [className]="(activeStatusTab['finalStatus'] == 'Paid') ? 'active-filter-class' : 'inactive-filter-cls'">Pending</button>
            <button (click)="onStatusChange('Verified')" style="cursor: pointer"
                [className]="(activeStatusTab['finalStatus'] == 'Verified') ? 'active-filter-class' : 'inactive-filter-cls'">Submit</button>
            <button (click)="onStatusChange('Scheduled')" style="cursor: pointer"
                [className]="(activeStatusTab['finalStatus'] == 'Scheduled') ? 'active-filter-class' : 'inactive-filter-cls'">Meeting</button>
            <button (click)="onStatusChange('Approved')" style="cursor: pointer"
                [className]="(activeStatusTab['finalStatus'] == 'Approved') ? 'active-filter-class' : 'inactive-filter-cls'">Signed</button>
            <button (click)="onStatusChange('Rejected')" style="cursor: pointer"
                [className]="(activeStatusTab['finalStatus'] == 'Rejected') ? 'active-filter-class' : 'inactive-filter-cls'">Rejected</button>
        </div>
    </div>
    <div class="listofdocuments-cls">
        <mat-card *ngFor="let document of filteredList;let i = index" [id]="'mydocument'+i" class="document-card-cls">

            <div class="container-cls" [id]="'containerid'+i"
                [innerHTML]="(document.htmlValue == undefined )? ((document.userAffidavitCustomName == null || document.userAffidavitCustomName == undefined || document.userAffidavitCustomName == '')?document.templateName:document.userAffidavitCustomName) :document.htmlValue | safe: 'html'"
                ></div>
            <div class="actiongroup-container-cls">
                <h1 matTooltipPosition="above"
                    *ngIf="document.userAffidavitCustomName != null && document.userAffidavitCustomName != undefined && document.userAffidavitCustomName != ''"
                    [matTooltip]="document.userAffidavitCustomName">
                    {{document.userAffidavitCustomName}}
                </h1>
                <h1 matTooltipPosition="above"
                    *ngIf="document.userAffidavitCustomName == null || document.userAffidavitCustomName == undefined || document.userAffidavitCustomName == ''"
                    [matTooltip]="document.templateName">
                    {{document.templateName}}
                </h1>
                <div class="upperrorw-cls">
                    <button *ngIf="document.status === 'Paid' && document.registrarStatus !== 'Approved'" (click)="verifyNINSign(document)" class="enablebutton-cls" matTooltip="Verify" matTooltipPosition="above" aria-label="Verify"><mat-icon>verified</mat-icon></button>
                    <button *ngIf="document.registrarStatus === 'Approved'" (click)="downloadDocument(document)" class="enablebutton-cls" matTooltip="Download" matTooltipPosition="above" aria-label="Download"><mat-icon>download</mat-icon></button>
                    <button *ngIf="document.registrarStatus != 'Approved'" (click)="openFinalPriview(document)" class="enablebutton-cls" [disabled]="document.disablePreviewFlag" matTooltip="Preview" matTooltipPosition="above" aria-label="Preview"><mat-icon>visibility</mat-icon></button>
                    <button [disabled]="document.status === 'Paid'"
                    [ngClass]="[(document.status === 'Paid') ? 'disablebutton-cls' : 'enablebutton-cls', (document.isUploaded || document.isCaseRelated) ? 'hide-button' : 'show-button']"
                        (click)="editAffidavit(document)" *ngIf="document.registrarStatus != 'Approved' && document.status != 'Verified'" matTooltip="Edit" matTooltipPosition="above" aria-label="Edit"><mat-icon>edit</mat-icon></button>
                    <button *ngIf="document.registrarStatus != 'Approved' && document.status == 'Pending'"
                        [ngClass]='(document.status === "Paid")?"disablebutton-cls":"enablebutton-cls"'
                        (click)="deleteUserAffidavit(i, document)" matTooltip="Delete" matTooltipPosition="above" aria-label="Delete"><mat-icon>delete</mat-icon></button>
                    <button *ngIf="document.status === 'Verified' && document.registrarStatus !== 'Scheduled' && document.registrarStatus !== 'Approved' && document.registrarStatus !== 'Rejected'" (click)="scheduleDocument(document,'Verified')" class="enablebutton-cls" matTooltip="Schedule" matTooltipPosition="above" aria-label="Schedule"><mat-icon>event</mat-icon></button>
                    <button *ngIf="document.registrarStatus === 'Scheduled' && document.canCancelAppointment" (click)="cancelScheduledAppointment(document)" class="enablebutton-cls" matTooltip="Cancel" matTooltipPosition="above" aria-label="Cancel"><mat-icon>event_busy</mat-icon></button>
                    <button *ngIf="document.registrarStatus === 'Scheduled'" [disabled]="!canJoinMeeting(document)"
                        [ngClass]="canJoinMeeting(document) ? 'enablebutton-cls' : 'disablebutton-cls'"
                        (click)="joinMeeting(document)" matTooltip="Join" matTooltipPosition="above" aria-label="Join"><mat-icon>video_call</mat-icon></button>
                    <button *ngIf="document.registrarStatus === 'Scheduled' && document.missedAppointment" (click)="scheduleDocument(document,'Scheduled')" class="enablebutton-cls" matTooltip="Reschedule" matTooltipPosition="above" aria-label="Reschedule"><mat-icon>update</mat-icon></button>
                    <button *ngIf="activeStatusTab['finalStatus'] == 'Scheduled' && canSendToSignDocument(document)"
                        [disabled]="document.disableSendToSign" (click)="sendToSign(document)" class="enablebutton-cls" matTooltip="Send to Sign" matTooltipPosition="above" aria-label="Send to Sign"><mat-icon>send</mat-icon></button>
                    <button *ngIf="activeStatusTab['finalStatus'] == 'Scheduled' && canSignDocument(document)"
                        (click)="signDocument(document)" class="enablebutton-cls" matTooltip="Sign" matTooltipPosition="above" aria-label="Sign"><mat-icon>gesture</mat-icon></button>
                    <button *ngIf="document.registrarStatus === 'Rejected' && canRecreateDocument(document)" (click)="recreateDocument(document)" class="enablebutton-cls" matTooltip="Recreate" matTooltipPosition="above" aria-label="Recreate"><mat-icon>refresh</mat-icon></button>
                    <button *ngIf="document.registrarStatus === 'Rejected'" (click)="showRejectReason(document)" class="enablebutton-cls" matTooltip="Reason" matTooltipPosition="above" aria-label="Reason"><mat-icon>info</mat-icon></button>
                </div>
                <div class="upperrorw-cls"
                    *ngIf="document.registrarStatus != 'Approved' && document.status == 'Pending'">
                    <button [ngClass]="(document.status != 'Pending')?'disablebutton-cls':'enablebutton-cls'" matTooltip="Pay" matTooltipPosition="above" aria-label="Pay" >
                        <app-payment-check [affidavitIdFromParent]="document.userAffidavitId"
                            [affidavitpriceFromParent]="document.price"
                            [isPriceDialogOpen]="shouldOpenPriceDialog"
                            [templatePrice]="document.templatePrice"
                            [templateFastTrackPrice]="document.templateFastTrackPrice"
                            [affidavitnameFromParent]="(!!document.userAffidavitCustomName)?document.userAffidavitCustomName:document.templateName" [isExpress]="document.isExpress"
                            (someEvent)="eventTriggeredFromPaymentChild()"></app-payment-check>
                    </button>
                </div>

                <p matTooltip = "Marked genuine by {{document.registrarName}} (Registrar of {{document.registrarCourtName}})" *ngIf="document.registrarStatus == 'Approved' && !!document.registrarName" class="status-badge-cls">Marked by {{document.registrarName}}</p>
                <p *ngIf="document.registrarStatus == 'Approved' && !document.registrarName" class="status-badge-cls">Genuine</p>
                <p *ngIf="document.registrarStatus != 'Approved'" class="status-badge-cls">{{document.status}}</p>

            </div>

        </mat-card>
    </div>
</div>
