<div class="dialogwrapper-cls">
  
  <div class="h-100">
    
    <p class="custom-heading-class">
      <!-- Affidavit Name  -->
      
      <span> {{ documentname }} </span>
    </p>
    
    <div class="body-cls shadow-sm p-3 mb-5 bg-white rounded" id="templatePreview" *ngIf="!pdfData"></div>
    <div class="body-cls shadow-sm p-3 mb-5 bg-white rounded pdf-body-cls" *ngIf="pdfData">
      <pdf-viewer [src]="pdfData" [render-text]="true" [original-size]="false"
        style="width: 100%; height: 100%; display: block;"></pdf-viewer>
    </div>
    <div class="actionbar-cls w-100 mt-4">
      <button class="btn button-cls" (click)="onClosePopup()" style="background-color: var(--customgrey);" mat-raised-button>Close</button>
      <button (click)="joinMeeting()" class="btn button-cls"
        style="background-color: var(--custombtnColor);" mat-raised-button>
        Join Meeting
      </button>
    </div>
  </div>
</div>
